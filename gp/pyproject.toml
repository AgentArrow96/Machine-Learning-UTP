[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "floodnet-course-project"
version = "1.0.0"
description = "Reproducible FloodNet RF / CUDA U-Net comparison and static results explorer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3", "Pillow>=11,<13", "scikit-image>=0.25,<0.27",
  "scikit-learn>=1.8,<2", "joblib>=1.4,<2", "psutil>=7,<8",
  "torch==2.11.0", "torchvision==0.26.0", "segmentation-models-pytorch==0.5.0",
  "matplotlib>=3.10,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Hybrid U-Net + DenseCRF. No Windows wheels exist: pip builds it from source (needs MSVC Build Tools).
crf = ["pydensecrf2==1.1"]

[project.scripts]
floodnet = "floodnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
